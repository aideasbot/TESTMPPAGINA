<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago recibido · Pido Club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 24px; padding: 36px 28px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.10); }
        .icono { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; font-weight: 500; line-height: 1.6; margin-bottom: 24px; }
        .btn-ws { display: flex; align-items: center; justify-content: center; gap: 10px; background: #22c55e; color: white; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 800; width: 100%; cursor: pointer; text-decoration: none; margin-bottom: 12px; }
        .btn-volver { display: block; font-size: 12px; color: #94a3b8; font-weight: 700; text-decoration: none; margin-top: 8px; }
        .estado-pending { color: #f59e0b; }
        .estado-failure { color: #ef4444; }
        .logo { max-height: 36px; margin-bottom: 24px; opacity: 0.7; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="contenido">
        <div class="spinner"></div>
        <p>Procesando tu pago...</p>
    </div>

    <script>
        const LOGO_PIDO = "https://lh3.googleusercontent.com/d/1P2TxCXAVAkMBBU6m2PIzGFbhrqzq2Lzw";

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name) || "";
        }

        function render() {
            const status = getParam("status");
            const pedidoRaw = localStorage.getItem('mp_pedido_pendiente');
            const card = document.getElementById('contenido');

            let telefono = "", texto = "";
            let pedidoValido = false;

            if (pedidoRaw) {
                try {
                    const pedido = JSON.parse(pedidoRaw);
                    // Considerar válido si tiene menos de 30 minutos
                    if (Date.now() - pedido.ts < 30 * 60 * 1000) {
                        telefono = pedido.telefono;
                        texto = pedido.texto;
                        pedidoValido = true;
                    }
                } catch(e) {}
            }

            if (status === "approved") {
                if (pedidoValido) {
                    localStorage.removeItem('mp_pedido_pendiente');
                    // Redirigir instantáneamente a WhatsApp
                    window.location.href = `https://wa.me/${telefono}?text=${texto}`;
                } else {
                    card.innerHTML = `
                        <img src="${LOGO_PIDO}" class="logo" alt="Pido Club">
                        <div class="icono">✅</div>
                        <h1>¡Pago aprobado!</h1>
                        <p style="color:#ef4444; font-size:13px;">No encontramos tu pedido. Por favor volvé al menú y contactá al negocio.</p>
                        <a href="javascript:history.back()" class="btn-volver">← Volver al menú</a>
                    `;
                }

            } else if (status === "pending") {
                card.innerHTML = `
                    <img src="${LOGO_PIDO}" class="logo" alt="Pido Club">
                    <div class="icono">⏳</div>
                    <h1 class="estado-pending">Pago pendiente</h1>
                    <p>Tu pago está siendo procesado. Cuando se confirme te avisaremos.<br>Igualmente podés enviar tu pedido al negocio.</p>
                    ${pedidoValido
                        ? `<a class="btn-ws" href="https://wa.me/${telefono}?text=${texto}"><i class="fab fa-whatsapp"></i> Enviar pedido por WhatsApp</a>`
                        : ""
                    }
                    <a href="javascript:history.back()" class="btn-volver">← Volver al menú</a>
                `;
                if (pedidoValido) localStorage.removeItem('mp_pedido_pendiente');

            } else if (status === "failure") {
                card.innerHTML = `
                    <img src="${LOGO_PIDO}" class="logo" alt="Pido Club">
                    <div class="icono">❌</div>
                    <h1 class="estado-failure">El pago no se procesó</h1>
                    <p>Hubo un problema con tu pago. Podés intentarlo de nuevo o elegir otro medio de pago.</p>
                    <a href="javascript:history.back()" class="btn-ws" style="background:#e11d48;">← Volver e intentar de nuevo</a>
                `;

            } else {
                // Sin status (acceso directo a la página)
                card.innerHTML = `
                    <img src="${LOGO_PIDO}" class="logo" alt="Pido Club">
                    <div class="icono">🛒</div>
                    <h1>Pido Club</h1>
                    <p>Esta página es la pantalla de confirmación de pago.</p>
                    <a href="/" class="btn-volver">← Ir al menú</a>
                `;
            }
        }

        render();
    </script>
</body>
</html>
